# Production Docker Compose Configuration
# This file is optimized for production deployment

services:
  # ================================
  # PostgreSQL Service (Production)
  # ================================
  postgres:
    image: postgres:15-alpine
    container_name: ai-postgres-prod
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - postgres_logs:/var/log/postgresql
    environment:
      POSTGRES_DB: ai_media_translation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prod123456}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c logging_collector=on
      -c log_destination=stderr
      -c log_statement=none
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres", "-d", "ai_media_translation"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ai-backend-network

  # ================================
  # Redis Service (Production)
  # ================================
  redis:
    image: redis:7-alpine
    container_name: ai-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-prod123456}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ai-backend-network

  # ================================
  # Backend API Service (Production)
  # ================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ai-backend-api-prod
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - backend_logs:/app/logs
      - uploads:/app/uploads
    environment:
      # Production mode
      - NODE_ENV=production
      - DEBUG=false
      - PYTHONPATH=/app
      
      # Database configuration
      - DATABASE_TYPE=postgres
      - POSTGRES_URI=postgresql://postgres:${POSTGRES_PASSWORD:-prod123456}@postgres:5432/ai_media_translation
      - REDIS_URL=redis://:${REDIS_PASSWORD:-prod123456}@redis:6379/0
      
      # API configuration
      - HOST=0.0.0.0
      - PORT=8000
      
      # Security (use environment-specific secrets)
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      
      # Ollama configuration
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-deepseek-coder:6.7b-instruct}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-300}
      - OLLAMA_MAX_TOKENS=${OLLAMA_MAX_TOKENS:-4096}
      
      # File upload configuration
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-104857600}
      - MAX_AUDIO_SIZE=${MAX_AUDIO_SIZE:-52428800}
      - MAX_VIDEO_SIZE=${MAX_VIDEO_SIZE:-104857600}
      
      # CORS configuration
      - CORS_ORIGINS=${CORS_ORIGINS}
      
      # Performance configuration
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-50}
      - PROCESSING_TIMEOUT=${PROCESSING_TIMEOUT:-3600}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-40}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - ai-backend-network

  # ================================
  # Monitoring Services (Optional)
  # ================================
  grafana:
    image: grafana/grafana:latest
    container_name: ai-grafana-prod
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - grafana_logs:/var/log/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_SECURITY_ALLOW_EMBEDDING: true
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3001}
    depends_on:
      - backend
    networks:
      - ai-backend-network

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-prometheus-prod
    restart: always
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - ai-backend-network

# ================================
# Volumes
# ================================
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  backend_logs:
    driver: local
  uploads:
    driver: local
  grafana_data:
    driver: local
  grafana_logs:
    driver: local
  prometheus_data:
    driver: local

# ================================
# Networks
# ================================
networks:
  ai-backend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16